<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share · Lugano Orders</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/style.css">
<style>
  .big{display:block;width:100%;border:0;border-radius:14px;background:#1FA855;color:#fff;font:700 19px/1 system-ui,sans-serif;padding:18px;margin:10px 0 6px}
  .big.done{background:#DDEFE3;color:#14532D}
  .ghost{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font-size:16px}
  .small{color:var(--muted);font-size:14px;margin:4px 0 14px}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:12px 0}
  .thumbs img{width:100%;border-radius:8px;border:1px solid var(--line)}
  .thumbs .file{border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px;word-break:break-word}
  h1{font-size:26px}
</style>
</head>
<body>
<header><div class="bar"><a class="brand" href="/"><img src="/wordmark.png" alt="LUGANO" width="122" height="22"></a></div></header>
<main><div id="box"><p>Getting the files from the app…</p></div></main>
<script src="/share/share.js"></script>
</body>
</html>
